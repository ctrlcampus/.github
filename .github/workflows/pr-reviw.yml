name: AI Auto Review (Reusable Workflow)

on:
  workflow_call:
    inputs:
      reviewer_username:
        description: "GitHub username to trigger AI review for"
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai_review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch PR diff
        run: |
          echo "Fetching PR diff for ${{ github.event.pull_request.url }}"
          curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.diff" \
            ${{ github.event.pull_request.url }} > pr.diff

      - name: Check diff
        run: |
          if [ ! -s pr.diff ]; then
            echo "⚠️ No changes detected, skipping AI review."
            exit 0
          fi

      - name: Debug reviewers (for verification)
        run: echo "Reviewers: ${{ toJson(github.event.pull_request.requested_reviewers) }}"

      - name: Run AI Review
        id: review
        run: |
          echo "Running AI review for reviewer: ${{ inputs.reviewer_username }}"

          # Check if reviewer is assigned to this PR
          if ! echo "${{ toJson(github.event.pull_request.requested_reviewers.*.login) }}" | grep -qi "${{ inputs.reviewer_username }}"; then
            echo "Reviewer ${{ inputs.reviewer_username }} not assigned — skipping."
            exit 0
          fi

          echo "Sending diff to OpenAI..."
          REVIEW=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4o-mini",
              "messages": [
                {"role": "system", "content": "You are an expert senior code reviewer. Provide concise, actionable feedback focused on code quality, logic errors, performance, and readability."},
                {"role": "user", "content": "'"$(cat pr.diff)"'"}
              ]
            }' | jq -r '.choices[0].message.content')

          echo "$REVIEW" > review.txt

      - name: Post AI Review Comment
        if: success()
        run: |
          echo "Posting AI review to PR..."
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -d "{\"body\": \"🤖 **AI Review (requested for @${{ inputs.reviewer_username }}):**\n\n$(cat review.txt | jq -s -R .)\"}"
